ext {
    minSdkVersion = 22
    // Play rejects a new upload below API 35, and raises the floor every
    // August. Capacitor 6 does not pin this — every Capacitor module reads
    // rootProject.ext.compileSdkVersion and only falls back to 34 — so the
    // bump propagates to all 11 plugins from here.
    //
    // compileSdk 35 requires Android Gradle Plugin 8.6+, which in turn requires
    // Gradle 8.9+; both are raised to match in build.gradle and the wrapper.
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.8.0'
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.9.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'
}