ext {
    minSdkVersion = 22
    // Play raises the floor every year: from 2026-11-01 an update must target
    // API 36 (Android 16) or it is refused. Capacitor 6 does not pin this —
    // every Capacitor module reads rootProject.ext.compileSdkVersion and only
    // falls back to 34 — so the bump propagates to all 11 plugins from here.
    //
    // compileSdk 36 is supported from Android Gradle Plugin 8.9, which in turn
    // requires Gradle 8.11.1+; both are raised to match in build.gradle and
    // the wrapper.
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.8.0'
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.9.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'
    // Links play-services-auth into @capacitor-firebase/authentication so
    // Google sign-in works natively. Also needs the signing key's SHA-1 on the
    // Firebase Android app, or Google answers DEVELOPER_ERROR (code 10).
    rgcfaIncludeGoogle = true
}