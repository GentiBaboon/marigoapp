name: CI

on:
  push:
    branches: [main, marigoappv1.0]
  # Every pull request, whatever its base.
  #
  # This used to be `branches: [main]`, so a PR stacked on another feature
  # branch got no typecheck, no tests and no build — and because neither job is
  # marked required, GitHub still reported the PR as CLEAN and it could be
  # merged on the Vercel check alone. PR #28 reached that state.
  #
  # `reopened` and `edited` matter too: retargeting a PR fires `edited`, which
  # is not in the default set, so a stacked PR rebased onto main after its
  # parent merged would otherwise still show the parent's stale run — or none.
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

# One live run per PR or branch. Pushing twice in quick succession otherwise
# leaves the first run grinding through E2E for results nobody will read, while
# holding a runner.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    # `edited` fires for title and body edits too; only a base change alters
    # what needs testing.
    if: github.event.action != 'edited' || github.event.changes.base != null

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck
        continue-on-error: true  # Pre-existing TS errors (FirestoreTimestamp.toDate)

      - name: Unit & Component tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: test-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: test.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:123:web:abc'

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Chromium is a ~150MB download from Microsoft's CDN, repeated on every
      # run because the runner starts empty. That download has hung outright
      # more than once — one job sat on it until GitHub's 6-hour ceiling killed
      # it, without ever reaching a test. Caching it keyed on the resolved
      # Playwright version means it is fetched once per version bump instead of
      # once per push, which removes the failure mode and saves ~4 minutes a run.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        timeout-minutes: 10

      # The browser binary is cached but its shared libraries are not — they
      # live in system paths outside the cache, so they must be installed even
      # on a hit. This is cheap; the download is what was expensive.
      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        timeout-minutes: 5

      - name: Run E2E tests
        run: npx playwright test
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: test-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: test.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:123:web:abc'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
